# DINO-TransUNet — Pretrained DINO ViT-S backbone + U-Net decoder
# Self-supervised encoder trained on 15k live embryo images
# python -m src.train --config configs/dino_transunet.yaml

model:
  name: dino_transunet
  in_channels: 3
  out_channels: 2          # DAPI + Phalloidin
  embed_dim: 384           # ViT-Small
  patch_size: 16
  depth: 12
  num_heads: 6
  dino_checkpoint: null    # Set to path of your DINO checkpoint
  freeze_encoder: false    # Set true to freeze encoder initially
  skip_layers: [3, 6, 9, 12]  # Tap features at these transformer layers
  decoder_channels: [256, 128, 64, 32]

data:
  root_dir: /content/drive/MyDrive/embryo_data
  target_channels: both
  img_size: 512
  batch_size: 8
  num_workers: 0
  val_split: 0.15
  test_split: 0.10
  seed: 42

loss:
  type: combined
  losses:
    - name: weighted_l1
      weight: 1.0
      params:
        signal_weight: 200.0
        bg_weight: 1.0
        threshold: 0.005
    - name: dice
      weight: 1.0
      params:
        smooth: 1.0
        per_channel: true

optimizer:
  lr: 1.0e-4             # Lower LR for fine-tuning pretrained encoder
  weight_decay: 1.0e-4

scheduler:
  min_lr: 1.0e-6

training:
  epochs: 200
  amp: false
  output_dir: outputs
  save_every: 20
  patience: 40
  preview_every: 20
